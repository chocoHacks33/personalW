      <path d="M29 349C126 290 184 325 250 266s135-37 187-96 106-59 177-95" fill="none" stroke="#65dcff" stroke-width="4" stroke-dasharray="10 11"/>
      <path d="m604 67 18 5-9 17" fill="none" stroke="#65dcff" stroke-width="4"/>
      <rect x="25" y="30" width="602" height="2" fill="url(#scan)"/>

      <g transform="translate(178 272)">
        <rect x="-38" y="-31" width="76" height="61" rx="12" fill="#102f42" stroke="#65dcff" stroke-width="3"/>
        <circle cx="-24" cy="36" r="13" fill="#061019" stroke="#65dcff" stroke-width="3"/>
        <circle cx="24" cy="36" r="13" fill="#061019" stroke="#65dcff" stroke-width="3"/>
        <path d="M-19-31v-18M19-31v-18" stroke="#65dcff" stroke-width="3"/>
