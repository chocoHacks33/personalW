<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">BrainHack rescue robot project cover</title>
  <desc id="desc">A rescue robot maps an indoor environment while detecting a fallen person.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.62" stop-color="#10283a"/>
      <stop offset="1" stop-color="#18364a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65dcff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#65dcff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#65dcff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8adfff" stroke-opacity="0.065"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <path d="M0 545 355 362l221 84 245-211 379 177v338H0Z" fill="#071018" opacity="0.72"/>
